<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/makatipid_logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Makatipid</title>

    <meta
      name="description"
      content="Makatipid connects property owners and renters in one map. List a place in minutes, browse what's nearby, and settle payment securely."
    />

    <!-- Link previews. LinkedIn and Facebook require absolute image URLs, and
         their crawlers do not run JavaScript, so these live in the static HTML.
         Update the origin here if the site moves to a custom domain. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Makatipid" />
    <meta property="og:title" content="Makatipid — Rental marketplace" />
    <meta
      property="og:description"
      content="Find a place that fits your budget. Browse rentals on a map, book with confidence, and pay securely."
    />
    <meta property="og:url" content="https://makatipid-website.vercel.app/" />
    <meta property="og:image" content="https://makatipid-website.vercel.app/Makatipid.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1248" />
    <meta property="og:image:height" content="832" />
    <meta property="og:image:alt" content="Makatipid logo" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Makatipid — Rental marketplace" />
    <meta
      name="twitter:description"
      content="Find a place that fits your budget. Browse rentals on a map, book with confidence, and pay securely."
    />
    <meta name="twitter:image" content="https://makatipid-website.vercel.app/Makatipid.jpg" />
    <meta name="twitter:image:alt" content="Makatipid logo" />
    <script>
      // Apply the saved theme before first paint so dark mode never flashes white.
      (function () {
        try {
          var stored = localStorage.getItem('makatipid:theme')
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches
          var dark = stored === 'dark' || (stored !== 'light' && prefersDark)
          if (dark) document.documentElement.classList.add('dark')
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
